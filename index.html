<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>大风起兮 · 吹风小游戏</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="game"></canvas>

<!-- ===== 游戏 HUD ===== -->
<div id="hud" class="hidden">
  <div class="hud-top">
    <div class="hud-title">
      <div id="levelName">晨风村</div>
      <div id="goalText">已吹飞 0 / 0</div>
    </div>
    <div class="hud-btns">
      <button id="btnRecal" class="mini" title="重新校准麦克风">校准</button>
      <button id="btnRestart" class="mini" title="重玩本关">重玩</button>
      <button id="btnMenu" class="mini" title="返回菜单">菜单</button>
      <button id="btnDebug" class="mini" title="调试信息">🐛</button>
    </div>
  </div>
  <div id="demoHint" class="hidden">👆 按住屏幕 = 吹气（演示模式）</div>
  <div id="micRow" class="hidden">
    <div class="wind-label">🎤 拾音</div>
    <div class="wind-bar slim"><div id="micFill"></div></div>
  </div>
  <div class="wind-meter" id="wind-meter">
    <div class="wind-label">风力</div>
    <div class="wind-bar"><div id="windFill"></div></div>
    <div id="windVal">0%</div>
  </div>
</div>

<div id="debug" class="hidden"></div>

<!-- ===== 开始菜单 ===== -->
<div id="screen-start" class="screen">
  <h1>🌬️ 大风起兮</h1>
  <p class="sub">把手机举到嘴边，<br>用力对麦克风吹气！</p>
  <p class="sub2">吹得越猛，风越大。<br>把树叶、草帽、雨伞…<br>还有抱着树的人，统统吹上天！</p>
  <button id="btnMic" class="big">🎤 用麦克风吹气</button>
  <button id="btnDemo" class="big ghost">👆 演示模式（按住 = 吹气）</button>
  <p class="hint">需要麦克风权限 · iPhone 麦克风在手机底部</p>
</div>

<!-- ===== 麦克风校准 ===== -->
<div id="screen-cal" class="screen hidden">
  <h2 id="calTitle">保持安静…</h2>
  <div class="cal-bar"><div id="calFill"></div></div>
  <p id="calHint">正在测量环境音量</p>
</div>

<!-- ===== 通关 ===== -->
<div id="screen-win" class="screen hidden">
  <h1>🎉 挑战成功！</h1>
  <div id="winStats" class="stats"></div>
  <button id="btnAgain" class="big">再来一次</button>
  <button id="btnMenu2" class="big ghost">返回菜单</button>
</div>

<div id="toast"></div>

<script src="game.js"></script>
</body>
</html>
