<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>大风起兮 · 吹风小游戏</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="game"></canvas>

<!-- ===== 游戏 HUD ===== -->
<div id="hud" class="hidden">
  <div class="hud-top">
    <div class="hud-title">
      <div id="levelName">晨风村</div>
      <div id="goalText">已吹飞 0 / 0</div>
    </div>
    <div class="hud-btns">
      <button id="btnRecal" class="mini" title="重新校准麦克风">校准</button>
      <button id="btnRestart" class="mini" title="重玩本关">重玩</button>
      <button id="btnMenu" class="mini" title="返回菜单">菜单</button>
      <button id="btnDebug" class="mini" title="调试信息">🐛</button>
    </div>
  </div>
  <div id="demoHint" class="hidden">👆 按住屏幕 = 吹气（演示模式）</div>
  <div id="micRow" class="hidden">
    <div class="wind-label">🎤 拾音</div>
    <div class="wind-bar slim"><div id="micFill"></div></div>
  </div>
  <div class="wind-meter" id="wind-meter">
    <div class="wind-label">风力</div>
    <div class="wind-bar"><div id="windFill"></div></div>
    <div id="windVal">0%</div>
  </div>
</div>

<div id="debug" class="hidden"></div>

<!-- ===== 首页：选关 ===== -->
<div id="screen-start" class="screen">
  <h1>🌬️ 大风起兮</h1>
  <p class="sub">对麦克风吹气，把东西吹上天！<br>吹得越猛，风越大。</p>
  <div id="modeSwitch" class="mode-switch">
    <button id="modeMic" class="mode-btn active">🎤 麦克风</button>
    <button id="modeDemo" class="mode-btn">👆 演示</button>
  </div>
  <div id="levelGrid" class="level-grid"></div>
  <p class="hint">需要麦克风权限 · iPhone 麦克风在手机底部</p>
</div>

<!-- ===== 麦克风校准 ===== -->
<div id="screen-cal" class="screen hidden">
  <h2 id="calTitle">保持安静…</h2>
  <div class="cal-bar"><div id="calFill"></div></div>
  <p id="calHint">正在测量环境音量</p>
</div>

<!-- ===== 通关 ===== -->
<div id="screen-win" class="screen hidden">
  <h1>🎉 挑战成功！</h1>
  <div id="winStats" class="stats"></div>
  <button id="btnNext" class="big">下一关</button>
  <button id="btnAgain" class="big ghost">再来一次</button>
  <button id="btnMenu2" class="big ghost">返回选关</button>
</div>

<div id="toast"></div>

<script src="game.js"></script>
</body>
</html>
