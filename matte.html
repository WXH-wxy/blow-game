<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AI 抠图工具 v3</title>
</head>
<body>
<div id="out" style="white-space:pre;font:12px monospace">idle</div>
<script type="module">
const log = m => { document.getElementById('out').textContent += m + '\n'; };
function loadImage(src) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('load fail ' + src)); im.src = src; });
}
async function main() {
  // 拦截 fetch 记录所有请求
  const origFetch = window.fetch.bind(window);
  window.fetch = (url, opts) => origFetch(url, opts).then(r => {
    log('FETCH ' + String(url).slice(0, 130) + ' => ' + r.status + ' ' + (r.headers.get('content-type') || ''));
    return r;
  });
  log('importing @imgly/background-removal...');
  const { removeBackground } = await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm');
  log('imported, running on cand3.jpg (model will download from imgly CDN, may take a while)...');
  const t0 = Date.now();
  const blob = await removeBackground(location.origin + '/assets/beauty/cand3.jpg?t=' + Date.now(), {
    progress: (key, cur, tot) => { if (Math.random() < 0.2) log(`  ${key} ${Math.round((cur / tot) * 100)}%`); },
  });
  log('removal done in ' + ((Date.now() - t0) / 1000).toFixed(1) + 's, blob=' + blob.size + 'B');
  // blob → dataURL → 上传
  const buf = await blob.arrayBuffer();
  let b64 = '';
  const chunk = 0x8000;
  const u8 = new Uint8Array(buf);
  for (let i = 0; i < u8.length; i += chunk) b64 += String.fromCharCode.apply(null, u8.subarray(i, i + chunk));
  b64 = btoa(b64);
  const res = await fetch('/upload?name=beauty3.png', { method: 'POST', body: b64 });
  log('upload: ' + res.status + ' ' + (await res.text()));

  // 验证
  await new Promise(r => setTimeout(r, 1200));
  const v = await loadImage('assets/beauty/beauty3.png?t=' + Date.now());
  const vc = document.createElement('canvas');
  vc.width = v.naturalWidth; vc.height = v.naturalHeight;
  const vx = vc.getContext('2d', { willReadFrequently: true });
  vx.drawImage(v, 0, 0);
  const vd = vx.getImageData(0, 0, vc.width, vc.height).data;
  const corner = [vd[3], vd[(vc.width - 2) * 4 + 3], vd[((vc.height - 2) * vc.width) * 4 + 3], vd[((vc.height - 2) * vc.width + vc.width - 2) * 4 + 3]];
  const mid = vd[((vc.height >> 1) * vc.width + (vc.width >> 1)) * 4 + 3];
  let body = 0; const total = vc.width * vc.height;
  for (let i = 3; i < vd.length; i += 16) if (vd[i] > 128) body++;
  log(`verify: ${v.naturalWidth}x${v.naturalHeight} corners=${corner.join(',')} center=${mid} bodyRatio=${(body / (total / 16) * 100).toFixed(1)}%`);
  log('DONE');
}
main().catch(e => log('ERR ' + (e && e.message) + ' ' + (e && e.stack ? e.stack.split('\n')[1] : '')));
</script>
</body>
</html>
