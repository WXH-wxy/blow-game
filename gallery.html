<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美女素材预览 · 梦露风致敬款</title>
<style>
  body { background:#14161c; color:#e8eaf0; font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif; margin:0; padding:18px; }
  h1 { font-size:18px; margin:0 0 4px; }
  p.sub { font-size:13px; opacity:.65; margin:0 0 16px; }
  .grid { display:flex; flex-wrap:wrap; gap:16px; }
  .card { max-width:280px; }
  .card img { width:100%; border-radius:14px; display:block; background:#222; min-height:120px; }
  .cap { font-size:13px; opacity:.85; margin-top:8px; line-height:1.5; }
  .tag { display:inline-block; font-size:11px; background:rgba(255,255,255,.12); border-radius:8px; padding:2px 8px; margin-right:4px; }
</style>
</head>
<body>
<h1>🌬️ 美女素材候选 · 梦露风致敬款（写真级）</h1>
<p class="sub">三张候选，挑选你最喜欢的一张（可以指出哪里要改：发型/裙长/姿势/背景/表情…）</p>
<div class="grid">
  <div class="card">
    <img src="assets/beauty/cand1.jpg" alt="候选1">
    <div class="cap"><span class="tag">青底</span>候选1：纯色背景（方便以后抠图放进游戏）</div>
  </div>
  <div class="card">
    <img src="assets/beauty/cand2.jpg" alt="候选2">
    <div class="cap"><span class="tag">夜景</span>候选2：50年代纽约街头夜景（可直接当场景插图用）</div>
  </div>
  <div class="card">
    <img src="assets/beauty/cand3.jpg" alt="候选3">
    <div class="cap"><span class="tag">绿幕</span>候选3：绿幕背景（抠图最方便，动态姿势）</div>
  </div>
</div>
</body>
</html>
